name: ESP32-S3 firmware

on:
  workflow_dispatch:
  push:
    paths:
      - 'firmware/esp32s3/**'
      - 'firmware/nrf54l15/src/gw_core.*'
      - 'firmware/nrf54l15/include/**'
      - '.github/workflows/esp32s3-firmware.yml'
  pull_request:
    paths:
      - 'firmware/esp32s3/**'
      - 'firmware/nrf54l15/src/gw_core.*'
      - 'firmware/nrf54l15/include/**'
      - '.github/workflows/esp32s3-firmware.yml'

permissions:
  contents: read

concurrency:
  group: esp32s3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-contracts:
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.6@sha256:bf72fe7a15c22849a9a94147301165a545fb8905d97c176cf748e3e4614cac84
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test production modules with host I/O
        shell: bash
        run: |
          set -euo pipefail
          . /opt/esp/idf/export.sh
          python -m pip install 'jsonschema==4.25.1'
          python firmware/esp32s3/scripts/test_host.py --cc gcc --idf "$IDF_PATH"
          node --test firmware/esp32s3/components/gw_provision/tests/security2.test.mjs firmware/esp32s3/components/gw_provision/tests/ota.test.mjs
  target-build:
    runs-on: ubuntu-24.04
    # Official v5.5.6 multi-platform manifest, verified against Docker Hub.
    container: espressif/idf:v5.5.6@sha256:bf72fe7a15c22849a9a94147301165a545fb8905d97c176cf748e3e4614cac84
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the ESP32-S3 target
        shell: bash
        run: |
          set -euo pipefail
          . /opt/esp/idf/export.sh
          idf.py --version | tee idf-version.txt
          idf.py --version | grep -F 'v5.5.6'
          cd firmware/esp32s3
          # Exercise the complete local HTTP/Security2/OTA path. The default
          # board-safe configuration has no unverified setup GPIO/entry point.
          idf.py -DIDF_TARGET=esp32s3 -DSDKCONFIG_DEFAULTS='sdkconfig.defaults;sdkconfig.local-setup-test' build 2>&1 | tee target-build.log
          idf.py size 2>&1 | tee target-size.log
          grep -Fx 'CONFIG_GW_FACTORY_AUTHORIZED_SETUP=y' sdkconfig
          xtensa-esp32s3-elf-nm build/gw32_esp32s3.elf > target-symbols.txt
          grep -E '^[0-9a-fA-F]+ [Tt] gw_actions_local_ota$' target-symbols.txt
          grep -E '^[0-9a-fA-F]+ [Tt] gw_provision_open_window$' target-symbols.txt
          grep -F '_binary_app_js_start' target-symbols.txt
      - name: Preserve target build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            idf-version.txt
            firmware/esp32s3/target-build.log
            firmware/esp32s3/target-size.log
            firmware/esp32s3/target-symbols.txt
            firmware/esp32s3/dependencies.lock
            firmware/esp32s3/sdkconfig
            firmware/esp32s3/sdkconfig.local-setup-test
            firmware/esp32s3/build/*.bin
            firmware/esp32s3/build/*.elf
            firmware/esp32s3/build/*.map
            firmware/esp32s3/build/bootloader/bootloader.bin
            firmware/esp32s3/build/partition_table/partition-table.bin
            firmware/esp32s3/build/flasher_args.json
