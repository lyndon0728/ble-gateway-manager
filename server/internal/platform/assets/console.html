<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>蓝牙网关管理</title>
<style>body{margin:0;background:#f3f5f8;color:#172633;font:16px system-ui,sans-serif}main{max-width:1050px;margin:40px auto;padding:0 24px}h1{font-size:28px;margin-bottom:6px}.note{color:#627282;line-height:1.7}section{background:white;border:1px solid #dce2e8;border-radius:10px;padding:22px;margin:20px 0}label{display:inline-block;margin:5px 16px 10px 0}input{display:block;padding:10px;margin-top:6px;border:1px solid #adb9c4;border-radius:5px}button{background:#165d8e;color:white;padding:10px 16px;border:0;border-radius:5px;cursor:pointer;margin:4px}button:focus,input:focus{outline:3px solid #6eb7e9}nav{display:flex;flex-wrap:wrap}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:65vh;overflow:auto;font-size:13px;line-height:1.6}#message{color:#a42d24;min-height:24px}a{color:#165d8e}</style>
<main><h1>蓝牙网关管理</h1><div class="note">客户本地部署 · 网关运行、数据投递与命令状态</div>
<section id="login"><form id="loginForm"><label>账号<input id="name" autocomplete="username" required maxlength="100"></label><label>密码<input id="password" type="password" autocomplete="current-password" required maxlength="256"></label><button>登录</button></form><div class="note">首次使用请按部署说明在服务器上创建管理员。</div></section>
<section id="panel" hidden><div id="identity"></div><nav><button data-path="/api/v1/system/status">系统状态</button><button data-path="/api/v1/gateways">网关</button><button data-path="/api/v1/tasks">下行任务</button><button data-path="/api/v1/ble-peers">蓝牙对端</button><button data-path="/api/v1/auto-connect-rules">自动连接规则</button><button data-path="/api/v1/gatt-connections">GATT 连接</button><button data-path="/api/v1/rule-bundles">解析规则</button><button data-path="/api/v1/targets">转发目标</button><button data-path="/api/v1/deliveries">投递记录</button><button data-path="/api/v1/audit-events">操作审计</button><button id="logout">退出</button></nav><p class="note">按账号权限显示结果。客户应用通过 <a href="/openapi.json" target="_blank" rel="noopener">OpenAPI 接口契约</a> 集成；下一页使用同一查询快照。</p></section>
<div id="message" role="status" aria-live="polite"></div><section id="results" hidden><strong id="title"></strong><pre id="output"></pre><button id="next" hidden>下一页</button></section></main>
<script>
let csrf=sessionStorage.getItem('gw_csrf')||'', next='', current='';
const el=id=>document.getElementById(id);
async function request(path,method='GET',body){let r=await fetch(path,{method,credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:body?JSON.stringify(body):undefined});let v=r.status===204?{}:await r.json();if(!r.ok)throw Error((v.error?.code||r.status)+': '+(v.error?.message||'请求失败'));return v}
function user(p){el('identity').textContent=p.name+' · '+p.type;el('login').hidden=true;el('panel').hidden=false}
async function show(path){el('message').textContent='正在读取…';try{let v=await request(path);el('output').textContent=JSON.stringify(v,null,2);el('title').textContent=path.split('?')[0];el('results').hidden=false;next=v.nextCursor||'';el('next').hidden=!next;el('message').textContent='';}catch(e){el('message').textContent=e.message}}
el('loginForm').onsubmit=async e=>{e.preventDefault();try{let v=await request('/api/v1/auth/sessions','POST',{name:el('name').value,password:el('password').value});csrf=v.csrfToken;sessionStorage.setItem('gw_csrf',csrf);el('password').value='';user(v.principal);await show('/api/v1/system/status')}catch(e){el('message').textContent=e.message}};
document.querySelectorAll('[data-path]').forEach(b=>b.onclick=()=>{current=b.dataset.path;show(current)});
el('next').onclick=()=>show(current+'?cursor='+encodeURIComponent(next));
el('logout').onclick=async()=>{try{await request('/api/v1/auth/sessions/current','DELETE');sessionStorage.removeItem('gw_csrf');location.reload()}catch(e){el('message').textContent=e.message}};
request('/api/v1/auth/me').then(user).catch(()=>{});
</script></html>
